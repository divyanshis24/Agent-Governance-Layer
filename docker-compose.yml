# The full production-shaped stack: Redis for hot-path counters, PostgreSQL for
# durable records, OPA as the policy sidecar, the gateway, and the console.
#
#   docker compose up --build      → console on http://localhost:8000
#
# Without Docker the same stack runs natively via ./run.sh, which falls back to
# an in-process state store and SQLite.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agl
      POSTGRES_PASSWORD: agl
      POSTGRES_DB: agl
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agl"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The Policy Decision Point. Runs as a sidecar so evaluation is a loopback
  # call rather than a network hop.
  opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/agl.rego"]
    volumes: ["./backend/policies:/policies:ro"]
    ports: ["8181:8181"]

  agl:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://agl:agl@postgres:5432/agl
      # Switch to `opa` to route the permission gate through the sidecar.
      POLICY_ENGINE: rules
      OPA_URL: http://opa:8181
      FAIL_CLOSED: "true"
      HOST: 0.0.0.0
      PORT: 8000
      DEMO_MODE: "true"
    ports: ["8000:8000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on:
      - agl

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: agl
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on:
      - prometheus

volumes:
  pgdata:
